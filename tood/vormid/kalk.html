<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Saia kalkulaator</title>
    <script src="../js/saiakalkScript.js"></script>
    <script src="../js/tempKalk.js"></script>
    <script src="../js/valuutaKalk.js"></script>
    <script src="../js/Vanuskalk.js"></script>


    <link rel="stylesheet" href="kalkStyle.css">
</head>
<body>

<h1>Kalkulaatorid</h1>
<section id="yld">
<section id="osa1">
    <h2>Saia kalkulaator</h2>
    <label for="kogus">Kogus:</label>
    <input type="number" id="kogus" min="1" max="10" step="1" onchange="saiaKalk()">
    <br>
    <label for="saiatyyp">Palun vali saia tüüp</label>
    <select name="saiatyyp" id="saiatyyp" onchange="saiaKalk()">
        <option value="vali">vali...</option>
        <option value="mooni">moonisai</option>
        <option value="juustu">juustusai</option>
        <option value="pontsik">pontsik</option>
        <option value="kaneeli">kaneelisai</option>
    </select>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRPJ5yZ5TSfv4ZnNpx4XZYgADEIbohxG8I-GeNkvLOYwA&s=10" alt="" id="pilt" width="100" height="100">
    <div id="vastus"></div>
</section>

<section id="osa2">
    <h2>Temperatuuri kalkulaator</h2>
    <label for="temp">Sisesta temperatuuri</label>
    <input type="text" id="temp" min="-50" max="50" step="1" value="0">
    <br>

    <input type="radio" name="tempValik" id="celsius" value="celsius" onchange="tempTeisendus()">
    <label for="celsius"> &deg;C - Celsius</label>
    <br>

    <input type="radio" name="tempValik" id="fahrenheit" value="fahrenheit" onchange="tempTeisendus()">
    <label for="fahrenheit"> &deg;F - Farenheit</label>
    <br>

    <div id="vastus2"></div>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6mvwaRAZyuInMf3BrxvWGwKF7WWVMiJOXAOQvSRpCmQ&s=10" alt="">
</section>

<section id="osa3">
    <h2>Valuuta kalkukaator</h2>
    <label for="valuuta">Kirjuta kuhu teiseldame</label>
    (dollar, juann, krona, ruble)
    <input type="text" id="valuuta" name="valuuta">
    <br>
    <label for="euro">Sisesta summa eurodes</label>
    <input type="number" id="euro" min="1" max="10" step="1" onchange="valuutaKalk()">

    <div id="vastus3"></div>
</section>

    <section id="osa4">
        <h2>Vanusekalkulaator</h2>
        <label for="synniaasta">Sisesta oma sünniaasta:</label>
        <input type="number" id="synniaasta" >

        <button onclick="arvutaVanus()">Arvuta vanus</button>

        <div id="vastus4"></div>
    </section>
</section>
</body>
</html>
